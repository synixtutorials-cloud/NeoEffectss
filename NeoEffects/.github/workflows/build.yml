name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --stacktrace
      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: NeoEffects-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (lets the app show Update alerts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: NEOeffects ${{ steps.ver.outputs.name }}
          body: NEOeffects version ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
